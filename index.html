<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navaja & Co</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
   <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container"><a href="#" class="navbar-brand">Navaja &amp; Co</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
    <span class="navbar-toggler-icon"></span>
    </button>
    <div id="menu" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a href="#servicios" class="nav-link">Servicios</a></li>
        <li class="nav-item"><a href="#galeria" class="nav-link">Galería</a></li>

        </ul>
    </div>
        </div>
    </nav>
    <header class="bg-dark text-white text-center py-5">
        <div class="container">
            <h1>Barbería Clásica en Ituzaingo</h1>
            <p class="lead">Reservá tu turno desde tu celular</p>
            <a href="#reservas" class="btn btn-warning btn-lg">Reservar turno</a>
        </div>
    </header>
    <section id="servicios" class="container my-5">
        <h2 class="mb-4">Servicios</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="https://picsum.photos/400/250?random=1" alt="Corte clásico" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Corte clásico</h5>
                        <p class="card-text">$20000</p>
                        <a href="#reservas" class="btn btn-outline-dark">Reservar</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="https://picsum.photos/400/250?random=2" alt="Corte clásico" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Corte y barba</h5>
                        <p class="card-text">$28000</p>
                        <a href="#reservas" class="btn btn-outline-dark">Reservar</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="https://picsum.photos/400/250?random=3" alt="Corte clásico" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Corte de barba</h5>
                        <p class="card-text">$10000</p>
                        <a href="#reservas" class="btn btn-outline-dark">Reservar</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section id="galeria" class="container my-5">
        <h2 class="mb-4">Galería</h2>
        <div class="row g-2">
            <div class="col-6 col-md-4"><img src="https://picsum.photos/400/300?random=5" alt="Foto 1 de la barbería" class="img-fluid"></div>
            <div class="col-6 col-md-4"><img src="https://picsum.photos/400/300?random=6" alt="Foto 1 de la barbería" class="img-fluid"></div>
            <div class="col-6 col-md-4"><img src="https://picsum.photos/400/300?random=7" alt="Foto 1 de la barbería" class="img-fluid"></div>
            <div class="col-6 col-md-4"><img src="https://picsum.photos/400/300?random=8" alt="Foto 1 de la barbería" class="img-fluid"></div>
            <div class="col-6 col-md-4"><img src="https://picsum.photos/400/300?random=9" alt="Foto 1 de la barbería" class="img-fluid"></div>
            <div class="col-6 col-md-4"><img src="https://picsum.photos/400/300?random=10" alt="Foto 1 de la barbería" class="img-fluid"></div>
        </div>
